name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      - run: go build ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go test ./...
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - run: go build ./... && go vet ./...
        working-directory: examples
      - run: |
          awk -v h="## ${GITHUB_REF_NAME#v} " 'index($0, h) == 1 {f = 1; next} /^## / {f = 0} f' CHANGELOG.md > notes.md
          test -s notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
